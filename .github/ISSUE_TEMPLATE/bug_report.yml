name: Bug Report
description: File a bug report to help us improve FitWell Agent
title: "[BUG] <concise description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please provide as much context as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Set LLM_PROVIDER=...
        2. Run `python run.py`
        3. Send message "..."
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & Screenshots
      description: Paste any error messages, tracebacks, or console logs.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, Browser, LLM provider (Ollama / Gemini)
      placeholder: "macOS 15, Python 3.11, Chrome, Ollama (gemma4:e4b)"
    validations:
      required: true
